<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL Viewer</title>
<style>
  :root { --bg:#1e1f22; --panel:#2b2d31cc; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#4ea1ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  #bar { position:fixed; top:12px; left:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         background:var(--panel); padding:8px; border-radius:10px; backdrop-filter:blur(6px); max-width:calc(100% - 24px); }
  button, label.btn, select { background:#3a3d44; color:var(--fg); border:1px solid #4a4d55; border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover, label.btn:hover, select:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#000; }
  input[type=file] { display:none; }
  #info { position:fixed; bottom:12px; left:12px; background:var(--panel); padding:8px 12px; border-radius:10px;
          font:12px ui-monospace, Consolas, monospace; color:var(--muted); max-width:calc(100% - 24px);
          max-height:45vh; overflow:auto; backdrop-filter:blur(6px); }
  #info .model + .model { margin-top:8px; padding-top:8px; border-top:1px solid #ffffff14; }
  #info .head { display:flex; align-items:center; gap:6px; }
  #info .head b { color:var(--fg); font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #info .meta { padding-left:24px; white-space:nowrap; }
  #info .model.hidden .meta, #info .model.hidden b { opacity:.45; }
  #info input[type=color] { width:18px; height:18px; padding:0; border:none; border-radius:3px; background:none; cursor:pointer; }
  #info input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
  #info input[type=color]::-webkit-color-swatch { border:none; border-radius:3px; }
  #info .icon { padding:1px 6px; font-size:12px; line-height:16px; }
  #info .note { margin-top:8px; font-size:11px; opacity:.8; }
  #drop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
          font-size:20px; color:var(--muted); text-align:center; padding:16px; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .dim-label { font:11px ui-monospace, Consolas, monospace; color:#fff; background:#000a; padding:1px 5px;
               border-radius:4px; white-space:nowrap; }
  .measure-label { background:#3a2f00e6; color:#ffd54a; border:1px solid #ffd54a88; text-align:center; line-height:1.35; }
  .measure-label small { color:#e6d9a8; font-size:10px; }
  body.measuring #view canvas { cursor:crosshair; }
  #hint { position:fixed; right:12px; bottom:12px; background:var(--panel); color:var(--fg); padding:6px 10px;
          border-radius:8px; font-size:12px; max-width:calc(100% - 24px); backdrop-filter:blur(6px); }
  #hint[hidden] { display:none; }
  @media (max-width: 600px) {
    #bar { gap:6px; padding:6px; }
    button, label.btn, select { padding:5px 8px; font-size:13px; }
    #info { font-size:11px; max-height:30vh; padding:6px 10px; }
    #info .meta { padding-left:0; white-space:normal; }
    #info .note { font-size:10px; }
  }
  body.dragging #drop { background:#4ea1ff22; outline:3px dashed var(--accent); outline-offset:-12px; color:var(--fg); }
</style>
</head>
<body>
<div id="view"></div>
<div id="drop">Drop one or more .stl files here or click "Open STL"</div>

<div id="bar">
  <label class="btn">Open STL<input id="file" type="file" accept=".stl" multiple></label>
  <button id="clear">Clear</button>
  <button id="overlay" title="Place all models on top of each other, semi-transparent">Overlay</button>
  <button id="dims" title="Show length, width and height of each model">Dimensions</button>
  <button id="measure" title="Click two points on a model to measure the distance">Measure</button>
  <button id="wire">Wireframe</button>
  <button id="grid" class="on">Grid</button>
  <button id="axes">Axes</button>
  <button id="reset">Reset view</button>
  <select id="material" title="Material used for the weight estimate">
    <option value="1.24">PLA</option>
    <option value="1.27">PETG</option>
    <option value="1.04">ABS</option>
    <option value="1.07">ASA</option>
    <option value="1.21">TPU</option>
    <option value="1.15">Resin</option>
  </select>
</div>
<div id="info">No model loaded</div>
<div id="hint" hidden>Click two points on a model to measure · snaps to nearby corners · Esc cancels</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const container = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

// HTML labels for the dimension lines, drawn on top of the 3D view
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
container.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1f22);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100000);
camera.up.set(0, 0, 1);               // STL files are usually Z-up
camera.position.set(100, -150, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
scene.add(sun);
sun.position.set(1, -1, 2);
const camLight = new THREE.DirectionalLight(0xffffff, 0.6);
camera.add(camLight); scene.add(camera);

let grid = new THREE.GridHelper(200, 20, 0x666666, 0x3a3a3a);
grid.rotation.x = Math.PI / 2;
scene.add(grid);
let axes = new THREE.AxesHelper(50);
axes.visible = false;
scene.add(axes);

const PALETTE = [0x9fb4c7, 0xe0a458, 0x7fc28e, 0xd07a9b, 0xb39ddb, 0x6cc4d4];
const models = [];          // { name, mesh, size, volume (mm³) }
let wireframe = false;
let overlay = false;
let showDims = false;
const dimLineMat = new THREE.LineBasicMaterial({ color: 0xe6e6e6 });
const dimBoxMat = new THREE.LineBasicMaterial({ color: 0xe6e6e6, transparent: true, opacity: 0.25 });

// bounding box plus X/Y/Z dimension lines with labels, as a child of the mesh
// (the geometry spans x ±sx/2, y ±sy/2, z 0..sz after centering)
function makeDimensions(size) {
  const { x: sx, y: sy, z: sz } = size;
  const g = new THREE.Group();
  const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)), dimBoxMat);
  box.position.z = sz / 2;
  g.add(box);

  const off = Math.max(sx, sy, sz) * 0.08, tick = off * 0.4;
  const pts = [];
  const seg = (a, b) => pts.push(new THREE.Vector3(...a), new THREE.Vector3(...b));
  const label = (text, pos) => {
    const el = document.createElement('div');
    el.className = 'dim-label'; el.textContent = text;
    const o = new CSS2DObject(el); o.position.set(...pos); g.add(o);
  };
  const L = n => `${n.toFixed(2)} mm`;

  // X: along the front edge, in front of the model
  const yx = -sy / 2 - off;
  seg([-sx / 2, yx, 0], [sx / 2, yx, 0]);
  seg([-sx / 2, -sy / 2, 0], [-sx / 2, yx - tick, 0]);
  seg([sx / 2, -sy / 2, 0], [sx / 2, yx - tick, 0]);
  label(`X ${L(sx)}`, [0, yx, 0]);

  // Y: along the right edge, to the right of the model
  const xy = sx / 2 + off;
  seg([xy, -sy / 2, 0], [xy, sy / 2, 0]);
  seg([sx / 2, -sy / 2, 0], [xy + tick, -sy / 2, 0]);
  seg([sx / 2, sy / 2, 0], [xy + tick, sy / 2, 0]);
  label(`Y ${L(sy)}`, [xy, 0, 0]);

  // Z: vertical, at the front-right corner
  const zx = sx / 2 + off, zy = -sy / 2 - off;
  seg([zx, zy, 0], [zx, zy, sz]);
  seg([sx / 2, -sy / 2, sz], [zx + tick * 0.7, zy - tick * 0.7, sz]);
  label(`Z ${L(sz)}`, [zx, zy, sz / 2]);

  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), dimLineMat));
  return g;
}

// CSS2DRenderer only looks at each label's own .visible (not its parents'),
// so set it on every label explicitly
function updateDimsVisibility(m) {
  const v = showDims && m.mesh.visible;
  m.dims.visible = v;
  m.dims.traverse(o => { if (o.isCSS2DObject) o.visible = v; });
}
let fitState = null;
let colorIndex = 0;

// volume of a closed mesh: sum of signed tetrahedra (origin, a, b, c)
function meshVolume(geom) {
  const p = geom.attributes.position.array;
  let v = 0;
  for (let i = 0; i < p.length; i += 9) {
    const ax = p[i], ay = p[i + 1], az = p[i + 2];
    const bx = p[i + 3], by = p[i + 4], bz = p[i + 5];
    const cx = p[i + 6], cy = p[i + 7], cz = p[i + 8];
    v += ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx);
  }
  return Math.abs(v) / 6;
}

function applyMaterialMode(m) {
  const mat = m.mesh.material;
  mat.wireframe = wireframe;
  mat.transparent = overlay;
  mat.opacity = overlay ? 0.45 : 1;
  mat.depthWrite = !overlay;
  mat.side = overlay ? THREE.DoubleSide : THREE.FrontSide;
  mat.needsUpdate = true;
}

function addModel(buffer, name) {
  const geom = new STLLoader().parse(buffer);
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);
  // center in XY, put the bottom at Z=0
  geom.translate(-center.x, -center.y, -bb.min.z);
  const material = new THREE.MeshStandardMaterial({
    color: PALETTE[colorIndex++ % PALETTE.length], metalness: 0.1, roughness: 0.6, flatShading: true
  });
  const mesh = new THREE.Mesh(geom, material);
  const dims = makeDimensions(size);
  mesh.add(dims);
  scene.add(mesh);
  const m = { name, mesh, size, dims, volume: meshVolume(geom) };
  applyMaterialMode(m);
  updateDimsVisibility(m);
  models.push(m);
}

function removeModel(m) {
  scene.remove(m.mesh); m.mesh.geometry.dispose(); m.mesh.material.dispose();
  m.dims.traverse(o => {
    if (o.isCSS2DObject) o.element.remove();
    else if (o.geometry) o.geometry.dispose();
  });
  models.splice(models.indexOf(m), 1);
}

function clearModels() {
  while (models.length) removeModel(models[0]);
  colorIndex = 0;
  layout();
}

// side by side along X at the same scale, or all at the origin in overlay mode
function layout() {
  clearMeasurements();          // models may move, so old measurements would be wrong
  if (!models.length) {
    fitState = null;
    document.getElementById('info').textContent = 'No model loaded';
    document.getElementById('drop').style.display = '';
    document.title = 'STL Viewer';
    return;
  }
  const maxDim = Math.max(...models.map(m => Math.max(m.size.x, m.size.y, m.size.z))) || 1;
  let totalW;
  if (overlay) {
    models.forEach(m => (m.mesh.position.x = 0));
    totalW = Math.max(...models.map(m => m.size.x));
  } else {
    const gap = maxDim * 0.25;
    totalW = models.reduce((s, m) => s + m.size.x, 0) + gap * (models.length - 1);
    let x = -totalW / 2;
    for (const m of models) {
      m.mesh.position.x = x + m.size.x / 2;
      x += m.size.x + gap;
    }
  }
  const maxY = Math.max(...models.map(m => m.size.y));
  const maxZ = Math.max(...models.map(m => m.size.z));
  const span = Math.max(totalW, maxY, maxZ);

  // scale grid and axes to the whole scene
  const step = Math.pow(10, Math.floor(Math.log10(span / 2)));
  const gridSize = Math.ceil((span * 1.6) / step) * step;
  const wasVisible = grid.visible;
  scene.remove(grid); grid.geometry.dispose();
  grid = new THREE.GridHelper(gridSize, Math.round(gridSize / step), 0x666666, 0x3a3a3a);
  grid.rotation.x = Math.PI / 2; grid.visible = wasVisible;
  scene.add(grid);
  axes.scale.setScalar(maxDim / 50);

  // bounding sphere of the whole scene, used to frame it on any screen shape
  fitState = { target: new THREE.Vector3(0, 0, maxZ / 2), radius: 0.5 * Math.hypot(totalW, maxY, maxZ) };
  resetView();
  renderInfo();
  document.getElementById('drop').style.display = 'none';
  document.title = models.map(m => m.name).join(' + ') + ' – STL Viewer';
}

const fmt = (n, d = 2) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

function renderInfo() {
  const info = document.getElementById('info');
  if (!models.length) return;
  const sel = document.getElementById('material');
  const density = parseFloat(sel.value);              // g/cm³
  const matName = sel.selectedOptions[0].textContent;
  info.replaceChildren();
  for (const m of models) {
    const row = document.createElement('div');
    row.className = 'model' + (m.mesh.visible ? '' : ' hidden');

    const head = document.createElement('div');
    head.className = 'head';
    const color = document.createElement('input');
    color.type = 'color'; color.title = 'Color';
    color.value = '#' + m.mesh.material.color.getHexString();
    color.addEventListener('input', () => m.mesh.material.color.set(color.value));
    const name = document.createElement('b');
    name.textContent = m.name; name.title = m.name;
    const eye = document.createElement('button');
    eye.className = 'icon'; eye.textContent = m.mesh.visible ? 'Hide' : 'Show';
    eye.addEventListener('click', () => { m.mesh.visible = !m.mesh.visible; updateDimsVisibility(m); renderInfo(); });
    const del = document.createElement('button');
    del.className = 'icon'; del.textContent = '✕'; del.title = 'Remove';
    del.addEventListener('click', () => { removeModel(m); layout(); });
    head.append(color, name, eye, del);

    const tris = m.mesh.geometry.attributes.position.count / 3;
    const cm3 = m.volume / 1000;
    const meta1 = document.createElement('div');
    meta1.className = 'meta';
    meta1.textContent = `${fmt(m.size.x)} × ${fmt(m.size.y)} × ${fmt(m.size.z)} mm · ${tris.toLocaleString('en-US')} triangles`;
    const meta2 = document.createElement('div');
    meta2.className = 'meta';
    meta2.textContent = `Volume ${fmt(cm3)} cm³ · ≈ ${fmt(cm3 * density, 1)} g ${matName}`;
    row.append(head, meta1, meta2);
    info.append(row);
  }
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Weight assumes a solid print (100% infill) and a closed mesh.';
  info.append(note);
}

function resetView() {
  if (!fitState) return;
  const { target, radius } = fitState;
  // fit the sphere in the narrowest field of view (vertical on wide screens, horizontal on phones)
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const dist = (radius / Math.sin(Math.min(vfov, hfov) / 2)) * 1.1;
  controls.target.copy(target);
  camera.position.copy(target).add(new THREE.Vector3(0.3, -1, 0.6).normalize().multiplyScalar(dist));
  camera.near = dist / 1000; camera.far = dist * 100; camera.updateProjectionMatrix();
  controls.update();
}

async function readFiles(fileList) {
  const files = [...fileList];
  const skipped = files.filter(f => !/\.stl$/i.test(f.name)).map(f => f.name);
  for (const f of files.filter(f => /\.stl$/i.test(f.name))) {
    try { addModel(await f.arrayBuffer(), f.name); }
    catch (e) { alert(`Could not read ${f.name}: ${e.message}`); }
  }
  if (skipped.length) alert(`Skipped (not an .stl file): ${skipped.join(', ')}`);
  layout();
}

document.getElementById('file').addEventListener('change', e => { readFiles(e.target.files); e.target.value = ''; });
document.getElementById('clear').addEventListener('click', clearModels);
document.getElementById('material').addEventListener('change', renderInfo);

const toggle = (id, fn) => {
  const b = document.getElementById(id);
  b.addEventListener('click', () => b.classList.toggle('on', fn()));
};
toggle('overlay', () => {
  overlay = !overlay;
  models.forEach(applyMaterialMode);
  layout();
  return overlay;
});
toggle('dims', () => {
  showDims = !showDims;
  models.forEach(updateDimsVisibility);
  return showDims;
});
toggle('wire', () => {
  wireframe = !wireframe;
  models.forEach(applyMaterialMode);
  return wireframe;
});
toggle('grid', () => (grid.visible = !grid.visible));
toggle('axes', () => (axes.visible = !axes.visible));
document.getElementById('reset').addEventListener('click', resetView);

// ---- measuring: click two points on a model ----
const raycaster = new THREE.Raycaster();
const measureGroup = new THREE.Group();
scene.add(measureGroup);
const markerGeom = new THREE.SphereGeometry(1, 16, 12);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xffd54a, depthTest: false });
const measureLineMat = new THREE.LineBasicMaterial({ color: 0xffd54a, depthTest: false });
const SNAP_PX = 12;           // snap to a triangle corner within this many screen pixels
let measuring = false;
let pending = null;           // first point of a measurement in progress

function addMarker(p) {
  const s = new THREE.Mesh(markerGeom, markerMat);
  s.scale.setScalar((fitState ? fitState.radius : 50) * 0.012);
  s.position.copy(p);
  s.renderOrder = 999;
  measureGroup.add(s);
  return s;
}

function clearMeasurements() {
  measureGroup.traverse(o => {
    if (o.isCSS2DObject) o.element.remove();
    else if (o.isLine) o.geometry.dispose();
  });
  measureGroup.clear();
  pending = null;
}

// point on the visible models under the pointer, snapped to a nearby corner
function pickPoint(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - rect.left) / rect.width) * 2 - 1,
    -((ev.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(models.filter(m => m.mesh.visible).map(m => m.mesh), false);
  if (!hits.length) return null;
  const hit = hits[0];
  const pos = hit.object.geometry.attributes.position;
  let best = hit.point.clone(), bestDist = SNAP_PX;
  for (const i of [hit.face.a, hit.face.b, hit.face.c]) {
    const v = hit.object.localToWorld(new THREE.Vector3().fromBufferAttribute(pos, i));
    const s = v.clone().project(camera);
    const d = Math.hypot((s.x - ndc.x) * rect.width / 2, (s.y - ndc.y) * rect.height / 2);
    if (d < bestDist) { bestDist = d; best = v; }
  }
  return best;
}

function addMeasurement(a, b) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), measureLineMat);
  line.renderOrder = 998;
  measureGroup.add(line);
  const d = new THREE.Vector3().subVectors(b, a);
  const el = document.createElement('div');
  el.className = 'dim-label measure-label';
  el.innerHTML = `${fmt(d.length())} mm<br><small>Δx ${fmt(Math.abs(d.x))} · Δy ${fmt(Math.abs(d.y))} · Δz ${fmt(Math.abs(d.z))}</small>`;
  const label = new CSS2DObject(el);
  label.position.copy(a).add(b).multiplyScalar(0.5);
  measureGroup.add(label);
}

function setMeasuring(on) {
  measuring = on;
  document.body.classList.toggle('measuring', on);
  document.getElementById('hint').hidden = !on;
  if (!on) clearMeasurements();
  return on;
}
toggle('measure', () => setMeasuring(!measuring));

// a click (not a drag to rotate) places a point
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!measuring || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const p = pickPoint(e);
  if (!p) return;
  if (!pending) {
    pending = { point: p, marker: addMarker(p) };
  } else {
    addMarker(p);
    addMeasurement(pending.point, p);
    pending = null;
  }
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && pending) {
    measureGroup.remove(pending.marker);
    pending = null;
  }
});

// drag & drop (adds models to the ones already shown)
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  readFiles(e.dataTransfer.files);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// auto-load embedded models:
// window.STL_EMBED = { name, base64 }  or  [{ name, base64 }, ...]
if (window.STL_EMBED) {
  for (const { name, base64 } of [].concat(window.STL_EMBED)) {
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    addModel(bytes.buffer, name);
  }
  layout();
}
</script>
</body>
</html>
